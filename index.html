<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Position Sizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- LEFT: Inputs -->
    <section class="panel panel--inputs">
      <header class="panel__header">
        <span class="panel__label">POSITION SIZER</span>
        <span class="direction-badge" id="directionBadge"></span>
      </header>

      <form class="form" autocomplete="off" novalidate>

        <div class="field-group">
          <label class="field__label" for="accountSize">ACCOUNT SIZE</label>
          <div class="field__input-wrap">
            <span class="field__prefix">$</span>
            <input
              class="field__input"
              id="accountSize"
              type="number"
              inputmode="decimal"
              placeholder="50000"
              min="0"
              step="any"
            />
          </div>
          <span class="field__error" id="accountSizeError"></span>
          <span class="field__warning" id="accountSizeWarning"></span>
        </div>

        <div class="field-group">
          <label class="field__label" for="riskPct">RISK PER TRADE</label>
          <div class="field__input-wrap">
            <input
              class="field__input"
              id="riskPct"
              type="number"
              inputmode="decimal"
              placeholder="1"
              min="0"
              step="any"
            />
            <span class="field__suffix">%</span>
          </div>
          <span class="field__error" id="riskPctError"></span>
        </div>

        <div class="field-group">
          <label class="field__label" for="entryPrice">ENTRY PRICE</label>
          <div class="field__input-wrap">
            <span class="field__prefix">$</span>
            <input
              class="field__input"
              id="entryPrice"
              type="number"
              inputmode="decimal"
              placeholder="185.20"
              min="0"
              step="any"
            />
          </div>
          <span class="field__error" id="entryPriceError"></span>
        </div>

        <div class="field-group">
          <label class="field__label" for="stopPrice">STOP LOSS</label>
          <div class="field__input-wrap">
            <span class="field__prefix">$</span>
            <input
              class="field__input"
              id="stopPrice"
              type="number"
              inputmode="decimal"
              placeholder="181.50"
              min="0"
              step="any"
            />
          </div>
          <span class="field__error" id="stopPriceError"></span>
        </div>

      </form>
    </section>

    <!-- RIGHT: Results -->
    <section class="panel panel--results">

      <div class="results">

        <!-- Primary: Position Size -->
        <div class="result result--primary">
          <span class="result__label">SHARES</span>
          <span class="result__value result__value--primary" id="positionSize">—</span>
          <span class="result__subtext" id="positionSizeNote"></span>
        </div>

        <!-- Secondary: Exposure -->
        <div class="result result--secondary">
          <span class="result__label">TOTAL EXPOSURE</span>
          <span class="result__value result__value--secondary" id="totalExposure">—</span>
        </div>

        <!-- Tertiary row: Max Risk + Per Share -->
        <div class="results__row">
          <div class="result result--tertiary">
            <span class="result__label">MAX RISK</span>
            <span class="result__value result__value--tertiary" id="maxRisk">—</span>
          </div>
          <div class="result result--tertiary">
            <span class="result__label">PER SHARE</span>
            <span class="result__value result__value--tertiary" id="perShareRisk">—</span>
          </div>
        </div>

        <!-- R:R Targets -->
        <div class="rr-block">
          <span class="rr-block__title">R:R TARGETS</span>
          <div class="rr-block__row">
            <span class="rr-block__label">2R</span>
            <span class="rr-block__value" id="target2R">—</span>
          </div>
          <div class="rr-block__row">
            <span class="rr-block__label">3R</span>
            <span class="rr-block__value" id="target3R">—</span>
          </div>
        </div>

      </div>

    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
